<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer</title>

    <script type="module"
        src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: white;
        }

        model-viewer {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <!--
      Size: the 3rd value of camera-orbit is the camera distance.
      100% = default framing. Higher = bottle looks smaller (try 150%–250%).
    -->
    <model-viewer
        id="bottle"
        src="PureSip.glb"
        camera-controls
        auto-rotate
        camera-orbit="0deg 75deg 180%"
        max-camera-orbit="Infinity 180deg 300%"
        environment-image="neutral"
        shadow-intensity="1"
        shadow-softness="0.8"
        exposure="0.75"
        tone-mapping="aces">
    </model-viewer>

</body>
</html>
